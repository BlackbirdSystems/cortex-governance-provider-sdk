[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-governance-provider-sdk"
version = "0.1.0"
description = "Python SDK for Cortex governance providers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "fastmcp>=3,<4",
  "pydantic>=2,<3",
  "uvicorn>=0.30,<1.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
